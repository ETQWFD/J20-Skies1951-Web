<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>长空·1951 网页版 — J-20 Skies over Korea</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#20232a;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #c{position:absolute;inset:0;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;color:#ffe9c0;text-shadow:0 1px 3px #000}
  .flag{position:absolute;top:10px;left:12px;width:54px;height:36px;border:1px solid rgba(255,220,150,.7)}
  .flag2{position:absolute;top:10px;left:74px;width:54px;height:36px;border:1px solid rgba(255,220,150,.7)}
  .stat{position:absolute;top:12px;left:140px;font-size:15px;line-height:1.5;letter-spacing:1px}
  .stat b{color:#ffd25e}
  #speed{position:absolute;right:16px;bottom:14px;font-size:15px;text-align:right;line-height:1.6}
  #msg{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:30px;font-weight:700;color:#ffd9a0;letter-spacing:6px;opacity:0;transition:opacity .3s;text-shadow:0 2px 8px #000}
  #ov{position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 0%,#3a3f4a 0%,#1b1e25 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f2e6cf;z-index:9}
  #ov h1{font-size:46px;margin:0 0 6px;color:#ffd77a;letter-spacing:10px}
  #ov .sub{opacity:.8;margin-bottom:26px;font-size:15px;letter-spacing:2px}
  #ov .panel{max-width:560px;font-size:14px;line-height:2;background:rgba(0,0,0,.32);border:1px solid rgba(255,210,140,.35);border-radius:12px;padding:18px 22px;margin-bottom:24px}
  #go{pointer-events:auto;border:none;background:linear-gradient(180deg,#d23b2c,#9c2318);color:#fff;font-size:22px;letter-spacing:6px;padding:15px 58px;border-radius:40px;box-shadow:0 8px 26px rgba(0,0,0,.5);cursor:pointer}
  #go:active{transform:translateY(2px)}
  .tip{margin-top:18px;font-size:12px;opacity:.55}
  /* touch controls */
  .tbtn{position:absolute;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);
        display:none;align-items:center;justify-content:center;color:#fff;font-size:20px;pointer-events:auto;z-index:5}
  .tbtn:active{background:rgba(214,70,52,.45)}
  #tf{right:26px;bottom:120px} #tm{right:118px;bottom:60px;width:62px;height:62px;font-size:16px}
  #stick{position:absolute;left:34px;bottom:64px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.3);display:none;z-index:5}
  #knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.35)}
  @media (pointer:coarse){.tbtn{display:flex}#stick{display:block}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <canvas class="flag" width="54" height="36" id="f1"></canvas>
  <canvas class="flag2" width="54" height="36" id="f2"></canvas>
  <div class="stat">机炮 <b id="hp">100</b>　敌机 <b id="en">0</b>　击落 <b id="sc">0</b></div>
  <div id="speed"></div>
  <div id="msg"></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="tbtn" id="tf">火</div>
  <div class="tbtn" id="tm">弹</div>
</div>
<div id="ov">
  <h1>长空·1951</h1>
  <div class="sub">J-20 SKIES OVER KOREA · 网页版 · 抗美援朝</div>
  <div class="panel">
    驾驶歼-20 在硝烟弥漫的朝鲜上空迎击 F-86 机群。<br>
    <b>电脑</b>：W/S 油门 · ↑↓ 俯仰 · A/D 滚转 · Q/E 方向舵 · 空格机炮 · F 导弹<br>
    <b>手机</b>：左下摇杆控制俯仰/方向舵，右侧屏幕滑动控制滚转，火/弹按钮开火<br>
    低速会失速坠机，近地自动拉起——放心飞。
  </div>
  <button id="go">起 飞</button>
  <div class="tip">铭记历史 · 珍爱和平 · 吾辈自强</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x59574f);                 // smoke-stained slate
scene.fog=new THREE.FogExp2(0x6a6055,0.00105);             // drifting ash haze
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,0.5,12000);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// dim war-time sun + cold hemi fill
scene.add(new THREE.HemisphereLight(0x9a9388,0x332f28,0.85));
const sun=new THREE.DirectionalLight(0xd9c39a,1.15); sun.position.set(-600,800,-300); scene.add(sun);

// ---------- value-noise fbm terrain ----------
function hash(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,z){let f=0,amp=.5,fr=1;for(let i=0;i<5;i++){f+=amp*vnoise(x*fr,z*fr);fr*=2;amp*=.5;}return f;}
function groundH(x,z){
  let h=(fbm(x*0.0016+11,z*0.0016-7)-.5)*120;
  const r=Math.pow(fbm(x*0.0028-30,z*0.0028+12),1.6);
  h+=r*260*Math.max(0,(-z-200)/1600)*Math.min(1,Math.abs(x)/900+0.25);
  const d=Math.hypot(x,z); if(d<200)h=h*Math.min(1,(d-120)/80)+2*Math.max(0,(200-d)/80);
  return h;
}
const GS=5200, SEG=170;
const tg=new THREE.PlaneGeometry(GS,GS,SEG,SEG); tg.rotateX(-Math.PI/2);
const pos=tg.attributes.position, cols=[];
const colA=new THREE.Color(0x46502f),colB=new THREE.Color(0x3a3026),colS=new THREE.Color(0xe6ecf6),colR=new THREE.Color(0x2e2a22);
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),z=pos.getZ(i),y=groundH(x,z); pos.setY(i,y);
  let cc;
  if(y>150)cc=colS.clone();
  else{const p=fbm(x*.02+5,z*.02+5);cc=colA.clone().lerp(colB,Math.min(1,.3+p*.8));if(p<.04)cc.lerp(colR,.7);}
  cols.push(cc.r,cc.g,cc.b);
}
tg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3)); tg.computeVertexNormals();
const terrain=new THREE.Mesh(tg,new THREE.MeshLambertMaterial({vertexColors:true}));
scene.add(terrain);

// ---------- smoke columns + distant fires ----------
function smokeTex(){const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');
  const gr=g.createRadialGradient(32,32,2,32,32,30);gr.addColorStop(0,'rgba(70,66,62,.9)');gr.addColorStop(1,'rgba(70,66,62,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(cv);}
function fireTex(){const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');
  const gr=g.createRadialGradient(32,34,2,32,32,28);gr.addColorStop(0,'rgba(255,210,120,1)');gr.addColorStop(.5,'rgba(235,120,40,.7)');gr.addColorStop(1,'rgba(235,120,40,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(cv);}
const sTex=smokeTex(),fTex=fireTex();
const plumes=[];
function addPlume(x,z){
  for(let i=0;i<5;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:sTex,transparent:true,opacity:.5,depthWrite:false}));
    s.position.set(x+ (Math.random()-.5)*14,groundH(x,z)+18+i*16,z);s.scale.setScalar(40+i*16);scene.add(s);plumes.push({s,vy:5+Math.random()*4,life:Math.random()*4});}
  const f=new THREE.Sprite(new THREE.SpriteMaterial({map:fTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  f.position.set(x,groundH(x,z)+5,z);f.scale.setScalar(22);scene.add(f);plumes.push({s:f,vy:0,life:99});
}
for(let i=0;i<26;i++)addPlume((Math.random()-.5)*2600,-300-Math.random()*2200);

// ---------- models ----------
function jet(ours){
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshLambertMaterial({color:ours?0xcfd4dc:0x8d9299});
  const dark=new THREE.MeshLambertMaterial({color:0x2b2e33});
  const fus=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.6,9),bodyMat);g.add(fus);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(1.0,3.4,16),bodyMat);nose.rotation.x=-Math.PI/2;nose.position.z=-6.0;g.add(nose);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(11,0.18,3.2),bodyMat);wing.position.set(0,-.1,1.2);wing.rotation.y=.32;
  // symmetric delta via two swept boxes is complex; use a flat shape extrude
  wing.geometry.dispose();wing.geometry=new THREE.BoxGeometry(8.6,.18,2.6);wing.rotation.set(0,0,0);
  const shape=new THREE.Shape();shape.moveTo(0,-2.2);shape.lineTo(5.4,2.0);shape.lineTo(1.0,2.0);shape.lineTo(-1.0,2.0);shape.lineTo(-5.4,2.0);shape.lineTo(0,-2.2);
  const wgeo=new THREE.ExtrudeGeometry(shape,{depth:.16,bevelEnabled:false});wgeo.rotateX(Math.PI/2);wgeo.translate(0,.08,0);
  wing.geometry=wgeo;g.add(wing);
  const tailL=new THREE.Mesh(new THREE.BoxGeometry(.14,2.0,2.4),bodyMat);tailL.position.set(1.0,1.0,3.4);tailL.rotation.z=.22;g.add(tailL);
  const tailR=tailL.clone();tailR.position.x=-1.0;tailR.rotation.z=-.22;g.add(tailR);
  const can=new THREE.Mesh(new THREE.SphereGeometry(.7,12,8),new THREE.MeshLambertMaterial({color:0x23303d}));can.scale.set(.8,.55,1.7);can.position.set(0,.55,-3.4);g.add(can);
  for(const sx of [-0.7,0.7]){const nz=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.6,12),dark);nz.rotation.x=Math.PI/2;nz.position.set(sx,-.02,4.7);g.add(nz);}
  // red star marking (ours)
  if(ours){const starTex=starCanvas();const sm=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),new THREE.MeshBasicMaterial({map:starTex,transparent:true,side:THREE.DoubleSide}));
    sm.rotation.x=-Math.PI/2;sm.position.set(0,.12,.2);g.add(sm);}
  g.userData={flame:null};
  const flame=new THREE.Sprite(new THREE.SpriteMaterial({map:fTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  flame.position.set(0,0,5.2);flame.scale.setScalar(3);g.add(flame);g.userData.flame=flame;
  return g;
}
function starCanvas(){const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');
  x.fillStyle='#ffde3c';x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?9:22;x.lineTo(32+Math.cos(a)*r,32+Math.sin(a)*r);}x.closePath();x.fill();
  return new THREE.CanvasTexture(cv);}

const player=jet(true);scene.add(player);
player.position.set(0,320,260);
const enemies=[],bullets=[],missiles=[],bursts=[];
for(let i=0;i<9;i++)enemies.push({m:jet(false),alive:false,vel:new THREE.Vector3(),hp:0});
enemies.forEach(e=>{e.m.visible=false;scene.add(e.m);});

let speed=180,hp=100,score=0,kills=0,wave=0,waveLeft=0;
function spawnWave(){wave++;waveLeft=Math.min(3+wave,8);
  for(let i=0;i<waveLeft;i++){const e=enemies.find(q=>!q.alive);if(!e)break;
    e.alive=true;e.m.visible=true;e.hp=100;
    e.m.position.set((Math.random()-.5)*900,360+Math.random()*320,-700-Math.random()*700);
    e.vel.set((Math.random()-.5)*30,0,-150-Math.random()*40);}
  flash(`第 ${wave} 波敌机来袭`);
}

// ---------- controls ----------
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')fire();if(e.code==='KeyF')launchMissile();});
addEventListener('keyup',e=>keys[e.code]=false);
let stickX=0,stickY=0,lookDX=0;
const stickEl=document.getElementById('stick'),knob=document.getElementById('knob');
let stickId=null,lookId=null,lookLast={x:0,y:0};
function pos(t){const r=stickEl.getBoundingClientRect();return{x:t.clientX-r.left-r.width/2,y:t.clientY-r.top-r.height/2};}
addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    const r=stickEl.getBoundingClientRect();
    if(t.clientX<innerWidth*.42 && stickId===null){stickId=t.identifier;const p=pos(t);stickX=Math.max(-1,Math.min(1,p.x/48));stickY=Math.max(-1,Math.min(1,-p.y/48));knob.style.transform=`translate(${p.x}px,${p.y}px)`;}
    else if(lookId===null){lookId=t.identifier;lookLast={x:t.clientX,y:t.clientY};}
  }
},{passive:true});
addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===stickId){const p=pos(t);stickX=Math.max(-1,Math.min(1,p.x/48));stickY=Math.max(-1,Math.min(1,-p.y/48));knob.style.transform=`translate(${Math.max(-38,Math.min(38,p.x))}px,${Math.max(-38,Math.min(38,p.y))}px)`;}
    else if(t.identifier===lookId){lookDX+=(t.clientX-lookLast.x)*0.6;lookLast.x=t.clientX;lookLast.y=t.clientY;}
  }
},{passive:true});
addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===stickId){stickId=null;stickX=stickY=0;knob.style.transform='';}if(t.identifier===lookId)lookId=null;}},{passive:true});
document.getElementById('tf').addEventListener('touchstart',e=>{e.preventDefault();fire();},{passive:false});
document.getElementById('tm').addEventListener('touchstart',e=>{e.preventDefault();launchMissile();},{passive:false});

// ---------- weapons ----------
let gunCd=0,ms=4;
function fire(){if(gunCd>0)return;gunCd=.07;
  const f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
  for(let k=0;k<2;k++)bullets.push({p:player.position.clone().add(f.clone().multiplyScalar(7)).add(new THREE.Vector3((k?-.7:.7),0,0)),v:f.clone().multiplyScalar(900),life:1.4});}
function launchMissile(){if(ms<=0)return;ms--;
  let tgt=null,bd=1e9;enemies.forEach(e=>{if(!e.alive)return;const d=e.m.position.distanceTo(player.position);if(d<bd){bd=d;tgt=e;}});
  if(!tgt){flash('没有可锁定目标');ms++;return;}
  const f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
  missiles.push({p:player.position.clone().add(f.clone().multiplyScalar(7)),v:f.clone().multiplyScalar(speed+50),tgt,life:5});flash('导弹发射');}
function boom(p,sc=1){
  for(let i=0;i<10;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:Math.random()<.5?fTex:sTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    s.position.copy(p);s.scale.setScalar((14+Math.random()*20)*sc);scene.add(s);bursts.push({s,life:.7+Math.random()*.5});}
}
function flash(t){const el=document.getElementById('msg');el.textContent=t;el.style.opacity=1;clearTimeout(flash._t);flash._t=setTimeout(()=>el.style.opacity=0,1600);}

// ---------- flags ----------
function drawFlag(cv,withText){const x=cv.getContext('2d');x.fillStyle='#de141a';x.fillRect(0,0,54,36);x.fillStyle='#ffee46';
  function star(cx,cy,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}x.closePath();x.fill();}
  star(9,9,5.2);[[18,3.6],[21.7,7.2],[21.7,12.6],[18,16.2]].forEach(q=>{const a=Math.atan2(9-q[1]*1.8,9-q[0]*1.8);x.save();x.translate(q[0]*1.8,q[1]*2);x.rotate(a+Math.PI/2);star(0,0,1.9);x.restore();});
  if(withText){x.fillStyle='#ffee46';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText('八一',27,24);}
}
drawFlag(document.getElementById('f1'),false);drawFlag(document.getElementById('f2'),true);

// ---------- loop ----------
let running=false,last=0;
document.getElementById('go').addEventListener('click',()=>{document.getElementById('ov').style.display='none';running=true;spawnWave();last=performance.now();});
const upV=new THREE.Vector3(0,1,0),fwdV=new THREE.Vector3(0,0,-1);
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.04,(now-last)/1000);last=now;
  if(running){
    // intent
    let pitch=0,roll=0,yaw=0,thr=0;
    if(keys.KeyW)thr+=1;if(keys.KeyS)thr-=1;
    if(keys.ArrowUp)pitch+=1;if(keys.ArrowDown)pitch-=1;
    if(keys.KeyA)roll+=1;if(keys.KeyD)roll-=1;
    if(keys.KeyQ)yaw+=1;if(keys.KeyE)yaw-=1;
    pitch+=stickY;yaw-=stickX*.7;roll-=lookDX*.05;lookDX=0;
    thr+=.8;
    speed+=thr*80*dt;speed=Math.max(118,Math.min(320,speed));
    if(speed<150)pitch-=.3*dt;
    const f0=fwdV.clone().applyQuaternion(player.quaternion);
    const qp=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),pitch*1.2*dt);
    const qr=new THREE.Quaternion().setFromAxisAngle(fwdV.clone().applyQuaternion(player.quaternion),roll*2.2*dt);
    const qy=new THREE.Quaternion().setFromAxisAngle(upV,yaw*.9*dt);
    player.quaternion.multiply(qp).multiply(qr).multiply(qy);
    // ground avoidance
    const clr=player.position.y-groundH(player.position.x,player.position.z);
    if(clr<80){player.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),(1-clr/80)*1.4*dt));}
    const f=fwdV.clone().applyQuaternion(player.quaternion);
    player.position.addScaledVector(f,speed*dt);
    player.position.x=Math.max(-2500,Math.min(2500,player.position.x));
    player.position.z=Math.max(-2900,Math.min(1400,player.position.z));
    if(player.position.y<groundH(player.position.x,player.position.z)+6){hp=0;}
    player.userData.flame.scale.setScalar(2.4+Math.random()*.8);
    gunCd-=dt;

    // enemies
    let aliveN=0;
    enemies.forEach(e=>{if(!e.alive)return;aliveN++;
      e.m.position.addScaledVector(e.vel,dt);
      const toP=player.position.clone().sub(e.m.position);
      e.m.lookAt(e.m.position.clone().add(toP));
      if(toP.length()<700 && Math.random()<.008){const bf=fwdV.clone().applyQuaternion(e.m.quaternion);
        bullets.push({p:e.m.position.clone().addScaledVector(bf,6),v:bf.multiplyScalar(700),life:1.6,foe:true});}
      if(e.m.position.z>1500){e.alive=false;e.m.visible=false;}
    });
    if(aliveN===0)spawnWave();

    // bullets
    for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.p.addScaledVector(b.v,dt);b.life-=dt;
      let dead=b.life<=0||b.p.y<groundH(b.p.x,b.p.z);
      if(!dead&&!b.foe){for(const e of enemies)if(e.alive&&e.m.position.distanceTo(b.p)<7){e.hp-=12;boom(b.p,.5);if(e.hp<=0){e.alive=false;e.m.visible=false;boom(e.m.position,1.6);score+=100;kills++;}dead=1;break;}}
      else if(!dead&&b.foe&&b.p.distanceTo(player.position)<6){hp-=8;boom(b.p,.4);dead=1;}
      if(dead)bullets.splice(i,1);}
    // missiles
    for(let i=missiles.length-1;i>=0;i--){const m=missiles[i];m.life-=dt;
      if(m.tgt&&m.tgt.alive){const want=m.tgt.m.position.clone().sub(m.p).normalize();m.v.lerp(want.multiplyScalar(300),1.6*dt);}
      m.p.addScaledVector(m.v,dt);
      if(m.tgt&&m.tgt.alive&&m.p.distanceTo(m.tgt.m.position)<12){boom(m.tgt.m.position,2);m.tgt.alive=false;m.tgt.m.visible=false;score+=100;kills++;missiles.splice(i,1);continue;}
      if(m.life<=0||m.p.y<groundH(m.p.x,m.p.z)){boom(m.p,1);missiles.splice(i,1);}}
    // bursts
    for(let i=bursts.length-1;i>=0;i--){const z=bursts[i];z.life-=dt*1.6;z.s.scale.multiplyScalar(1.02);z.s.material.opacity=Math.max(0,z.life);if(z.life<=0){scene.remove(z.s);bursts.splice(i,1);}}
    // plumes drift
    plumes.forEach(q=>{if(q.vy>0){q.life-=dt;q.s.position.y+=q.vy*dt;q.s.material.opacity=.25+Math.sin(q.life*3)*.12;}});

    // camera chase
    const cf=fwdV.clone().applyQuaternion(player.quaternion),cu=upV.clone().applyQuaternion(player.quaternion);
    camera.position.copy(player.position).addScaledVector(cf,-22).addScaledVector(cu,6.5);
    camera.lookAt(player.position);
    document.getElementById('hp').textContent=Math.max(0,Math.round(hp));
    document.getElementById('en').textContent=aliveN;
    document.getElementById('sc').textContent=kills;
    document.getElementById('speed').innerHTML=`速度 ${Math.round(speed*3.6)} km/h<br>导弹 ${ms}`;
    if(hp<=0){running=false;setTimeout(()=>location.reload(),900);flash('战机被击落 · 重新出击');}
  }
  // plumes always animate
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
